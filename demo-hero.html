<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Clean Elite — demonstrație hero</title><style>html,body{margin:0;width:100%;height:100%;background:#103b3b}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe title="Demonstrație Clean Elite" src="./index.html"></iframe><script>document.querySelector("iframe").addEventListener("load",function(){const d=this.contentDocument;if(!d)return;const style=d.createElement("style");style.textContent="\n#acasa{position:relative;isolation:isolate;overflow:hidden}#ce-dust{position:absolute;inset:0;width:100%;height:100%;z-index:80;pointer-events:none;transition:opacity .3s}#ce-cloth{position:absolute;left:0;top:0;width:145px;height:95px;border-radius:24% 15% 19% 12%;background:repeating-linear-gradient(28deg,#aedddd 0 1px,#91c8cb 1px 3px);box-shadow:inset 0 0 0 4px #bee5e2,inset -15px -14px 18px #428b9255,0 13px 24px #0005;z-index:81;pointer-events:none;opacity:0;will-change:transform}#ce-cloth:after{content:'';position:absolute;inset:12px;border:1px dashed #568c94;border-radius:18%}#ce-sheen{position:absolute;inset:0;z-index:82;pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 25%,#fff5 48%,transparent 65%);background-size:250% 100%}#ce-sheen.ce-glint{animation:ce-glint .7s ease-out forwards}@keyframes ce-glint{0%{opacity:0;background-position:120% 0}20%{opacity:.65}100%{opacity:0;background-position:-100% 0}}#ce-replay{position:fixed;bottom:18px;right:16px;z-index:9999;border:1px solid #c2dfdb;background:#103b3b;color:white;padding:12px 17px;border-radius:30px;font:600 14px system-ui;box-shadow:0 4px 20px #0003;cursor:pointer}#ce-replay:focus-visible{outline:3px solid #f1bf6e;outline-offset:3px}@media(max-width:600px){#ce-cloth{width:110px;height:80px}#ce-replay{bottom:80px}}@media(prefers-reduced-motion:reduce){#ce-dust,#ce-cloth,#ce-sheen{display:none}}\n";d.head.append(style);const script=d.createElement("script");script.textContent="\n(()=>{'use strict';\nconst hero=document.getElementById('acasa');if(!hero)return;\nconst canvas=document.createElement('canvas');canvas.id='ce-dust';canvas.setAttribute('aria-hidden','true');\nconst cloth=document.createElement('div');cloth.id='ce-cloth';cloth.setAttribute('aria-hidden','true');\nconst sheen=document.createElement('div');sheen.id='ce-sheen';sheen.setAttribute('aria-hidden','true');\nconst replay=document.createElement('button');replay.id='ce-replay';replay.textContent='Reia anima\u021bia';replay.type='button';\nhero.append(canvas,cloth,sheen);document.body.append(replay);\nconst ctx=canvas.getContext('2d');let frame=0,timer=0,finishTimer=0;\nfunction finish(){cancelAnimationFrame(frame);clearTimeout(timer);clearTimeout(finishTimer);canvas.style.opacity='0';cloth.style.opacity='0';hero.dataset.reveal='complete'}\nfunction start(){finish();if(!ctx||matchMedia('(prefers-reduced-motion: reduce)').matches)return;\nhero.dataset.reveal='running';sheen.classList.remove('ce-glint');\nconst w=hero.clientWidth,h=hero.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';\nconst haze=ctx.createLinearGradient(0,0,w,h);haze.addColorStop(0,'#a59e8f');haze.addColorStop(.5,'#c1b9a6');haze.addColorStop(1,'#878878');ctx.fillStyle=haze;ctx.fillRect(0,0,w,h);\nlet seed=47;const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};\nfor(let i=0;i<2200;i++){ctx.fillStyle=i%3?'rgba(65,55,40,.12)':'rgba(250,244,220,.25)';ctx.beginPath();ctx.arc(rand()*w,rand()*h,rand()*2+.3,0,Math.PI*2);ctx.fill()}\ncanvas.style.opacity='1';cloth.style.opacity='1';ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';ctx.lineCap='round';ctx.lineJoin='round';\nconst rows=Math.max(4,Math.ceil(h/180)),step=h/rows,radius=step*.76;let begin=0,previous=null;\nfinishTimer=setTimeout(finish,4800);\nfunction tick(time){if(!begin)begin=time;const progress=Math.min((time-begin)/2600,1),travel=progress*rows,row=Math.min(Math.floor(travel),rows-1),f=travel-row;\nconst x=(row%2?1-f:f)*(w+radius*2)-radius,y=step*(row+.5)+Math.sin(f*Math.PI*2)*step*.09;\nif(previous){ctx.lineWidth=radius*2;ctx.beginPath();ctx.moveTo(previous.x,previous.y);ctx.lineTo(x,y);ctx.stroke()}ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();previous={x,y};\ncloth.style.transform=`translate(${x-cloth.offsetWidth/2}px,${y-cloth.offsetHeight/2}px) rotate(${row%2?-14:14}deg)`;\nif(progress<1){frame=requestAnimationFrame(tick)}else{finish();sheen.classList.add('ce-glint')}}\ntimer=setTimeout(()=>{frame=requestAnimationFrame(tick)},250)}\nreplay.addEventListener('click',()=>{hero.scrollIntoView({block:'start',behavior:'instant'});start()});window.addEventListener('resize',finish);window.addEventListener('pagehide',finish);start();\n})();\n";d.body.append(script)});</script></body></html>
